# Production Environment Configuration (Profile: prod)
# Activated when SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cgfoodtour?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  base-url: ${APP_BASE_URL:http://localhost:8080/api}
  openapi:
    dev-url: ${APP_OPENAPI_DEV_URL:http://localhost:8080}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  admin:
    default-email: ${APP_ADMIN_DEFAULT_EMAIL:haoaboutme@gmail.com}
    default-password: ${APP_ADMIN_DEFAULT_PASSWORD:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  facebook:
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}

jwt:
  # JWT signer key must be a 64-character (512-bit) hex key for HS512
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION:1800} # 30 minutes in seconds
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:2592000} # 30 days in seconds

security:
  client-ip:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:}
    maximum-forwarded-hops: ${MAXIMUM_FORWARDED_HOPS:5}
  registration:
    ip-pepper: ${REGISTRATION_IP_PEPPER:${JWT_SIGNER_KEY}}
    cleanup-cron: ${REGISTRATION_CLEANUP_CRON:0 30 3 * * *}
  maps-resolver:
    maximum-concurrent-requests: ${MAPS_MAXIMUM_CONCURRENT_REQUESTS:10}
    maximum-cache-entries: ${MAPS_MAXIMUM_CACHE_ENTRIES:5000}
    success-cache-ttl: ${MAPS_SUCCESS_CACHE_TTL:15m}
    negative-cache-ttl: ${MAPS_NEGATIVE_CACHE_TTL:1m}
  auth-rate-limit:
    login-email-limit: ${AUTH_LOGIN_EMAIL_LIMIT:10}
    login-ip-limit: ${AUTH_LOGIN_IP_LIMIT:30}
    login-window: ${AUTH_LOGIN_WINDOW:15m}
    social-ip-limit: ${AUTH_SOCIAL_IP_LIMIT:20}
    social-window: ${AUTH_SOCIAL_WINDOW:5m}
    maximum-keys: ${AUTH_RATE_LIMIT_MAXIMUM_KEYS:10000}
    registration-ip-limit: ${AUTH_REGISTRATION_IP_LIMIT:5}
    registration-email-limit: ${AUTH_REGISTRATION_EMAIL_LIMIT:3}
    registration-ip-window: ${AUTH_REGISTRATION_IP_WINDOW:1h}
    registration-email-window: ${AUTH_REGISTRATION_EMAIL_WINDOW:24h}
    pending-registration-limit: ${AUTH_PENDING_REGISTRATION_LIMIT:5}
    pending-registration-retention: ${AUTH_PENDING_REGISTRATION_RETENTION:7d}
    maps-user-limit: ${AUTH_MAPS_USER_LIMIT:10}
    maps-ip-limit: ${AUTH_MAPS_IP_LIMIT:30}
    maps-window: ${AUTH_MAPS_WINDOW:5m}
  otp:
    # Use a dedicated high-entropy secret in production; do not reuse or commit real values.
    pepper: ${OTP_PEPPER:${JWT_SIGNER_KEY}}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:cgfoodtour/avatars}
  default-avatar-url: ${CLOUDINARY_DEFAULT_AVATAR_URL:https://res.cloudinary.com/dmeazyjkz/image/upload/v1787030590/avatar-default_i3mwpi.svg}

# Production Logging Configuration
logging:
  level:
    root: WARN
    com.cangiuoc.cgfoodtour: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
