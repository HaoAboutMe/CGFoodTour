# Master Configuration File
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Mặc định kích hoạt profile 'dev' khi chạy máy cục bộ
  application:
    name: cgfoodtour

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

app:
  business-zone: ${APP_BUSINESS_ZONE:Asia/Ho_Chi_Minh}

# Default security baseline: disable swagger-ui in other profiles unless explicitly enabled
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
