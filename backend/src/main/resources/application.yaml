# Master Configuration File
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Mặc định kích hoạt profile 'dev' khi chạy máy cục bộ
  application:
    name: cgfoodtour
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  # Development databases predate Flyway. Migration ownership is enabled only
  # by staging/production until a local database has been deliberately baselined.
  flyway:
    enabled: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

app:
  business-zone: ${APP_BUSINESS_ZONE:Asia/Ho_Chi_Minh}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

# Default security baseline: disable swagger-ui in other profiles unless explicitly enabled
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
