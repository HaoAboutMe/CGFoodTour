services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cgfoodtour
      MYSQL_USER: cgfoodtour
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - rehearsal_mysql:/var/lib/mysql
    networks: [cgfoodtour]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    networks: [cgfoodtour]
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: rehearsal
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cgfoodtour?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: cgfoodtour
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_ADMIN_DEFAULT_PASSWORD: ${APP_ADMIN_DEFAULT_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      OTP_PEPPER: ${OTP_PEPPER}
      REGISTRATION_IP_PEPPER: ${REGISTRATION_IP_PEPPER}
    networks: [cgfoodtour]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    networks: [cgfoodtour]

networks:
  cgfoodtour:
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  rehearsal_mysql:
