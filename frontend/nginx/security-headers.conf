add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://platform-lookaside.fbsbx.com https://*.googleusercontent.com https://cdnjs.cloudflare.com https://mt1.google.com https://server.arcgisonline.com https://basemaps.cartocdn.com; connect-src 'self' https://accounts.google.com https://graph.facebook.com https://photon.komoot.io; frame-src https://accounts.google.com https://www.facebook.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
